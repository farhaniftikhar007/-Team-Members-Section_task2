<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Dynamic Team About Page
  </title>

  <link
    rel="stylesheet"
    href="index.css"
  >

</head>

<body>

  <!-- HEADER -->

  <header class="header">

    <h1>
      Meet The <span>Innovators</span>
    </h1>

    <p>
      Engineering the future of digital experiences.
    </p>

  </header>

  <!-- SEARCH + FILTER -->

  <div class="top-bar">

    <input
      type="text"
      id="search"
      placeholder="Search Team Members..."
    >

    <select id="filter">

      <option value="">
        All Roles
      </option>

      <option value="Frontend">
        Frontend Developer
      </option>

      <option value="Backend">
        Backend Developer
      </option>

      <option value="React">
        React Developer
      </option>

      <option value="UI">
        UI UX Designer
      </option>

    </select>

  </div>

  <!-- TEAM CONTAINER -->

  <div id="team"></div>

  <!-- SCRIPT -->

  <script src="index.js"></script>

</body>

</html>
